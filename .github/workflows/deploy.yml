name: Deploy Minecraft Server

on:
  push:
    branches: [main, master, deployment_mc]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Navigate to project directory
        run: |
          PROJECT_DIR="$HOME/mc-server"
          if [ ! -d "$PROJECT_DIR" ]; then
            mkdir -p "$PROJECT_DIR"
          fi
          cd "$PROJECT_DIR"
          if [ ! -d ".git" ]; then
            git clone https://github.com/${{ github.repository }}.git .
          else
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
          fi

      - name: Ensure Docker Compose
        id: compose
        run: |
          set -e
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> "$GITHUB_OUTPUT"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          else
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.25.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy containers
        env:
          PAPER_VERSION: ${{ vars.PAPER_VERSION || '1.21.1' }}
          MINECRAFT_PORT: ${{ vars.MINECRAFT_PORT || '8888' }}
          SERVER_NAME: ${{ vars.SERVER_NAME || 'Minecraft Server' }}
          MAX_PLAYERS: ${{ vars.MAX_PLAYERS || '20' }}
          DIFFICULTY: ${{ vars.DIFFICULTY || 'easy' }}
          GAMEMODE: ${{ vars.GAMEMODE || 'survival' }}
          EULA: "true"
          MEMORY_MIN: ${{ vars.MEMORY_MIN || '1G' }}
          MEMORY_MAX: ${{ vars.MEMORY_MAX || '2G' }}
          PLUGIN_URLS: ${{ vars.PLUGIN_URLS || 'https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar,https://github.com/EngineHub/WorldEdit/releases/download/7.3.12/worldedit-bukkit-7.3.12.jar' }}
          PLUGIN_FORCE_DOWNLOAD: ${{ vars.PLUGIN_FORCE_DOWNLOAD || 'false' }}
        run: |
          cd "$HOME/mc-server"
          COMPOSE_CMD="${{ steps.compose.outputs.cmd }}"
          $COMPOSE_CMD pull || true
          $COMPOSE_CMD down
          $COMPOSE_CMD up -d --build
          docker image prune -f
