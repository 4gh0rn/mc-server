services:
  mc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mc-server
    ports:
      - "8888:8888"
    volumes:
      - minecraft-data:/minecraft
    environment:
      - MINECRAFT_VERSION=${MINECRAFT_VERSION:-latest}
      - MINECRAFT_PORT=${MINECRAFT_PORT:-8888}
      - SERVER_NAME=${SERVER_NAME:-Minecraft Server}
      - MAX_PLAYERS=${MAX_PLAYERS:-20}
      - DIFFICULTY=${DIFFICULTY:-easy}
      - GAMEMODE=${GAMEMODE:-survival}
      - EULA=${EULA:-false}
      - MEMORY_MIN=${MEMORY_MIN:-1G}
      - MEMORY_MAX=${MEMORY_MAX:-2G}
      - PLUGIN_URLS=${PLUGIN_URLS:-https://github.com/EssentialsX/Essentials/releases/download/2.20.1/EssentialsX-2.20.1.jar https://github.com/EngineHub/WorldEdit/releases/download/worldedit-bukkit-7.3.3/worldedit-bukkit-7.3.3.jar}
      - PLUGIN_FORCE_DOWNLOAD=${PLUGIN_FORCE_DOWNLOAD:-false}
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  minecraft-data:
    driver: local
